[package]
name = "kucheat"
version = "0.1.0"
edition = "2024"
description = "CHZZK live stream notifications with a Fluent 2 desktop interface for Linux"
rust-version = "1.90"

[[bin]]
name = "kucheat"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-build"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
notify-rust = "4"
ksni = "0.3"
dirs = "7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
auto-launch = "0.6.0"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tauri = { version = "2.12", features = ["custom-protocol"], optional = true }

[build-dependencies]
tauri-build = { version = "2.7", optional = true }
